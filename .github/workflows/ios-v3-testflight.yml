name: JourneyDeck V3 TestFlight

# Skeleton only. Does not invoke EAS Build or EAS Submit.
# V3 TestFlight targets the LIVE App Store listing (6806502526),
# bundle com.journeydeck.recorder, channel production, APP_VARIANT=v3-store.
# TestFlight only — NEVER App Store review submit from this stream.
# Never use isolated V3 preview ascAppId 6814695593 or the .v3 bundle.
# Submit still requires Patrick/CoS written clear. This skeleton never
# invokes EAS.
#
# Required later (not read by this workflow):
#   EXPO_TOKEN — Expo account token for eas-cli
# Credentials: prefer EAS-managed iOS credentials for com.journeydeck.recorder
# (`eas credentials`). Do not reuse ios-v3-device.yml ad hoc .p12 / profile secrets.
#
# Intended commands after written Patrick/CoS clear (run elsewhere):
#   $env:APP_VARIANT = 'v3-store'
#   npx eas-cli build --platform ios --profile v3-testflight --non-interactive
#   npx eas-cli submit --platform ios --profile v3-testflight --non-interactive

on:
  workflow_dispatch:
    inputs:
      authorize_eas_build_and_submit:
        description: Requires written Patrick/CoS clear. Live listing ascAppId 6806502526. TestFlight only — never App Store review. Default stays blocked. This skeleton still will not invoke EAS.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: journeydeck-v3-testflight
  cancel-in-progress: false

jobs:
  gate:
    # Standard public GitHub-hosted runner only. No macOS, larger, or paid runner.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Locate mobile project
        shell: bash
        run: |
          if [ -f mobile/recorder/eas.json ]; then
            echo 'MOBILE_DIR=mobile/recorder' >> "$GITHUB_ENV"
          elif [ -f eas.json ]; then
            echo 'MOBILE_DIR=.' >> "$GITHUB_ENV"
          else
            echo '::error::Mobile snapshot is missing'; exit 1
          fi
      - name: Document wiring and fail closed without Patrick/CoS clear
        env:
          AUTHORIZE_EAS_BUILD_AND_SUBMIT: ${{ github.event.inputs.authorize_eas_build_and_submit }}
        run: node "$MOBILE_DIR/scripts/v3-testflight-gate.mjs"

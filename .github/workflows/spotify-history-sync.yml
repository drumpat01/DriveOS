name: Sync Spotify history

on:
  schedule:
    - cron: "*/15 * * * *"
      timezone: "America/Chicago"
  workflow_dispatch:
    inputs:
      restart_backfill:
        description: Restart the resumable 365-day Spotify and soundtrack backfill
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: driveos-spotify-history-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Archive recent Spotify plays
        env:
          DRIVEOS_SYNC_URL: ${{ secrets.DRIVEOS_SYNC_URL }}
          DRIVEOS_SYNC_TOKEN: ${{ secrets.DRIVEOS_SYNC_TOKEN }}
          RESTART_BACKFILL: ${{ inputs.restart_backfill || false }}
        run: |
          test -n "$DRIVEOS_SYNC_URL"
          test -n "$DRIVEOS_SYNC_TOKEN"
          body='{}'
          if [ "$RESTART_BACKFILL" = "true" ]; then
            body='{"restartBackfill":true}'
          fi
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-all-errors --max-time 240 \
            --request POST \
            --header "X-DriveOS-Sync-Token: $DRIVEOS_SYNC_TOKEN" \
            --header "Content-Type: application/json" \
            --data "$body" \
            "$DRIVEOS_SYNC_URL/api/spotify/sync"

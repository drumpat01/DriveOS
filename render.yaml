services:
  - type: web
    name: driveos
    runtime: docker
    plan: starter
    region: ohio
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /readyz
    disk:
      name: atlas-production-data
      mountPath: /var/data/atlas
      sizeGB: 1
    envVars:
      - key: DRIVEOS_ATLAS_NODE_CANARY
        value: "true"
      - key: DRIVEOS_NODE_DATABASE
        value: /var/data/atlas/journeydeck.db
      - key: DRIVEOS_NODE_DATA_ROOT
        value: /var/data/atlas
      - key: DRIVEOS_NODE_HOUSEHOLD_ID
        value: household_primary
      - key: DRIVEOS_NODE_PUBLIC_ORIGIN
        value: https://journeydeck.me
      - key: DRIVEOS_PUBLIC_URL
        value: https://journeydeck.me
      - key: DRIVEOS_ATLAS_REFRESH_SECONDS
        value: "900"
      - key: DRIVEOS_MODE
        value: web
      - key: TZ
        value: America/Chicago
      - key: DRIVEOS_DATA_DIR
        value: /tmp/driveos
      - key: DRIVEOS_REPOSITORY_PROVIDER
        value: Turso
      - key: DRIVEOS_SESSION_HOURS
        value: "24"
      - key: JOURNEYDECK_TESSIE_DB_WRITE_ENABLED
        value: "false"
      - key: JOURNEYDECK_TESSIE_DB_READ_ENABLED
        value: "false"
      - key: JOURNEYDECK_TESSIE_READ_CANARY_APPROVED
        value: "false"
      - key: JOURNEYDECK_TESSIE_INITIAL_SYNC_DAYS
        value: "30"
      - key: JOURNEYDECK_TESSIE_READ_MAX_STALENESS_MINUTES
        value: "45"
      - key: JOURNEYDECK_TURSO_HTTP_TIMEOUT_SECONDS
        value: "30"
      - key: JOURNEYDECK_TURSO_BATCH_STATEMENTS
        value: "100"
      - key: TURSO_DATABASE_URL
        value: libsql://driveos-drumpat01.aws-us-east-2.turso.io
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: DRIVEOS_OWNER_EMAIL
        sync: false
      - key: DRIVEOS_PASSWORD_HASH
        sync: false
      - key: DRIVEOS_WIFE_USERNAME
        sync: false
      - key: DRIVEOS_WIFE_PASSWORD_HASH
        sync: false
      - key: DRIVEOS_AUTH_SECRET
        sync: false
      - key: DRIVEOS_ENCRYPTION_KEY
        sync: false
      - key: TESSIE_TOKEN
        sync: false
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: DRIVEOS_SPOTIFY_SYNC_SECRET
        sync: false
      - key: FOURSQUARE_API_KEY
        sync: false

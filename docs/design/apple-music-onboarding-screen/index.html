<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JourneyDeck — Apple Music onboarding</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 18px;
        background:
          radial-gradient(circle at 50% 12%, rgba(71, 42, 115, .34), transparent 38%),
          #040208;
        color: #faf7fc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main { text-align: center; }
      h1 { margin: 0 0 8px; font-size: clamp(22px, 4vw, 32px); }
      p { margin: 0 0 24px; color: #b8aebe; }
      img {
        display: block;
        width: min(480px, calc(100vw - 36px));
        height: auto;
        border-radius: 28px;
        box-shadow: 0 28px 90px rgba(0, 0, 0, .64), 0 0 50px rgba(255, 80, 103, .12);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Screen 3 · Connect Apple Music</h1>
      <p>Single JourneyDeck first-run mockup</p>
      <img src="apple-music-connect-screen.png" alt="JourneyDeck Apple Music onboarding screen" />
    </main>
  </body>
</html>

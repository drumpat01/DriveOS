<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090613">
  <title>JourneyDeck Sign In</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;--coral:#ff674b;--orange:#ff963f;--pink:#ff3765;--violet:#a65cff;--cyan:#33d9ee}*{box-sizing:border-box}html{min-height:100%;background:#050309}body{margin:0;min-height:100svh;display:grid;place-items:center;overflow-x:hidden;color:#f8f5fb;padding:max(28px,env(safe-area-inset-top)) 20px max(28px,env(safe-area-inset-bottom));background:radial-gradient(ellipse 55% 78% at -5% 58%,rgba(161,49,255,.78),rgba(101,25,188,.38) 43%,transparent 72%),radial-gradient(ellipse 55% 78% at 105% 58%,rgba(255,58,82,.78),rgba(255,116,43,.42) 43%,transparent 72%),radial-gradient(ellipse 85% 26% at 50% 103%,rgba(255,83,39,.26),transparent 63%),linear-gradient(165deg,#020105,#090312 46%,#050308)}
    main{position:relative;z-index:1;width:min(100%,620px);padding:clamp(34px,6vw,58px) clamp(24px,7vw,54px) clamp(30px,6vw,48px);overflow:hidden;border:1px solid transparent;border-radius:clamp(28px,6vw,50px);background:linear-gradient(rgba(11,7,22,.84),rgba(8,5,17,.94)) padding-box,linear-gradient(135deg,rgba(153,83,255,.95),rgba(255,83,76,.9) 58%,rgba(255,157,59,.78)) border-box;box-shadow:0 34px 100px rgba(0,0,0,.55),inset 0 1px rgba(255,255,255,.05)}.brand{display:flex;flex-direction:column;align-items:center;margin:0 auto 26px}.brand-mark{width:clamp(76px,19vw,112px);height:auto;filter:drop-shadow(0 0 18px rgba(255,87,57,.34))}.brand-name{margin:13px 0 0;background:linear-gradient(100deg,#ff9749,#ff704b 50%,#ff315f);background-clip:text;-webkit-background-clip:text;color:transparent;font-family:Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif;font-size:clamp(2.6rem,10vw,4.4rem);font-weight:500;letter-spacing:-.04em;line-height:1;filter:drop-shadow(0 0 14px rgba(255,91,54,.22))}.eyebrow{margin:0 0 10px;color:#ff855d;font-size:clamp(.76rem,2.7vw,.95rem);font-weight:750;letter-spacing:.27em;text-align:center;text-transform:uppercase}.tagline{margin:0 0 clamp(30px,7vw,46px);color:#f8f5fb;font-size:clamp(1.35rem,5vw,2rem);line-height:1.2;text-align:center}
    .field{position:relative;display:flex;align-items:center;min-height:clamp(70px,17vw,88px);margin-top:18px;border:1px solid rgba(206,143,255,.46);border-radius:20px;background:linear-gradient(110deg,rgba(109,58,146,.2),rgba(255,65,72,.055));box-shadow:inset 0 1px rgba(255,255,255,.035);transition:border-color .2s,box-shadow .2s}.field:focus-within{border-color:var(--coral);box-shadow:0 0 0 3px rgba(255,103,75,.13),0 0 28px rgba(166,92,255,.12)}.field-icon{flex:0 0 clamp(60px,15vw,78px);display:grid;place-items:center;align-self:stretch;color:#b975ff;border-right:1px solid rgba(255,255,255,.16)}.field-icon svg,.eye-icon{width:27px;height:27px;fill:none;stroke:currentColor;stroke-width:1.8}label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}input{min-width:0;flex:1;border:0;outline:0;background:transparent;color:#fff;padding:0 20px;font:inherit;font-size:clamp(1rem,4vw,1.18rem)}input::placeholder{color:#aaa2b4;opacity:1}.eye-icon{margin-right:19px;color:#b88aee}
    button{width:100%;min-height:clamp(60px,15vw,72px);border:0;border-radius:18px;padding:13px 18px;color:#fff;font:inherit;font-size:clamp(1rem,4vw,1.2rem);font-weight:750;cursor:pointer;transition:transform .18s,filter .18s,opacity .18s}button:hover{filter:brightness(1.08);transform:translateY(-1px)}button:active{transform:translateY(1px)}button:disabled{opacity:.58;cursor:wait;transform:none}#submitButton{margin-top:26px;background:linear-gradient(105deg,var(--orange),var(--coral) 48%,var(--pink));box-shadow:0 12px 34px rgba(255,66,75,.24),inset 0 1px rgba(255,255,255,.34)}.passkey-button{margin-top:16px;border:1px solid transparent;color:#f7f5fb;background:linear-gradient(rgba(9,6,18,.96),rgba(17,8,20,.96)) padding-box,linear-gradient(105deg,var(--violet),var(--cyan)) border-box}.passkey-button:before{content:"⌁";margin-right:12px;color:var(--cyan);font-size:1.45em;vertical-align:-.08em}.privacy{display:flex;align-items:center;justify-content:center;gap:9px;margin:30px 0 0;color:#aaa4b3;font-size:.92rem}.privacy svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7}#message{min-height:1.35em;margin:14px 0 0;color:#ffb2b8;text-align:center}[hidden]{display:none!important}
    @media(max-width:520px){body{padding-inline:13px}main{padding-inline:22px}.brand{margin-bottom:21px}.field{border-radius:17px}}@media(max-height:760px) and (min-width:600px){body{padding-block:18px}main{padding-block:26px}.brand-mark{width:70px}.brand-name{font-size:3rem;margin-top:7px}.brand,.tagline{margin-bottom:18px}.field{min-height:62px;margin-top:12px}button{min-height:56px}.privacy{margin-top:18px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
  <script src="/login.js" defer></script>
</head>
<body>
  <main>
    <header class="brand" aria-label="JourneyDeck"><img class="brand-mark" src="/assets/journeydeck-pulse-bare.svg" alt=""><h1 class="brand-name">JourneyDeck</h1></header>
    <p class="eyebrow">Welcome back</p><p class="tagline">Your movement, connected.</p>
    <form id="loginForm">
      <div class="field"><span class="field-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2z"/></svg></span><label for="email">Username or email</label><input id="email" name="email" type="text" autocomplete="username" placeholder="Username or email" required></div>
      <div class="field"><span class="field-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg></span><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Password" required><svg class="eye-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="2.5"/></svg></div>
      <button id="submitButton" type="submit">Sign in</button><button id="passkeyButton" class="passkey-button" type="button" hidden>Use Face ID or passkey</button><div id="message" role="alert" aria-live="polite"></div>
    </form>
    <p class="privacy"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>Private by design</p>
  </main>
</body>
</html>

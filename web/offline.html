<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef6f8">
  <title>JourneyDeck - Computer Offline</title>
  <style>
    :root { color-scheme: light; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 28px;
      background:
        radial-gradient(circle at 15% 0%, rgba(14,178,194,.12), transparent 30rem),
        linear-gradient(180deg, #f9fcfd, #eaf3f5);
      color: #10283a;
    }
    main {
      width: min(460px, 100%);
      padding: 34px;
      border: 1px solid rgba(33,83,101,.12);
      border-radius: 26px;
      background: rgba(255,255,255,.88);
      box-shadow: 0 28px 70px rgba(47,84,99,.12);
      text-align: center;
    }
    img { width: 86px; height: 86px; border-radius: 24px; }
    h1 { margin: 20px 0 8px; font-size: 2rem; }
    p { color: #667e89; line-height: 1.55; }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 10px;
      min-height: 48px;
      padding: 0 22px;
      border-radius: 14px;
      background: linear-gradient(135deg, #0da6bd, #13c99a);
      color: white;
      font: inherit;
      font-weight: 800;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <img src="/assets/pwa-192.png" alt="JourneyDeck">
    <h1>JourneyDeck is unavailable</h1>
    <p>Your desktop may be asleep, JourneyDeck may not be running, or this phone may not be connected to Tailscale.</p>
    <a href="/">Try again</a>
  </main>
</body>
</html>

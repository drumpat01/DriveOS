<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05040e">
  <title>JourneyDeck - Computer Offline</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 28px;
      background:
        radial-gradient(circle at 85% 0%, rgba(154,70,245,.18), transparent 30rem),
        radial-gradient(circle at 10% 80%, rgba(255,79,95,.12), transparent 28rem),
        #05040e;
      color: #f7f2fb;
    }
    main {
      width: min(460px, 100%);
      padding: 34px;
      border: 1px solid rgba(255,91,89,.22);
      border-radius: 26px;
      background: rgba(13,7,25,.9);
      box-shadow: 0 28px 70px rgba(0,0,0,.5);
      text-align: center;
    }
    img { width: 86px; height: 86px; border-radius: 24px; }
    h1 { margin: 20px 0 8px; font-size: 2rem; }
    p { color: #9c92aa; line-height: 1.55; }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 10px;
      min-height: 48px;
      padding: 0 22px;
      border-radius: 14px;
      background: linear-gradient(135deg, #ff9749, #ff315f);
      color: white;
      font: inherit;
      font-weight: 800;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <img src="/assets/journeydeck-cinematic-192.png?v=5.9.7" alt="JourneyDeck">
    <h1>JourneyDeck is unavailable</h1>
    <p>Your desktop may be asleep, JourneyDeck may not be running, or this phone may not be connected to Tailscale.</p>
    <a href="/">Try again</a>
  </main>
</body>
</html>

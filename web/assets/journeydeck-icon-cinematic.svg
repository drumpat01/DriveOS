<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">JourneyDeck pulse journey icon</title>
  <desc id="desc">A circular journey loop flows into a centered musical pulse.</desc>
  <defs>
    <linearGradient id="tile" x1="40" y1="30" x2="470" y2="480" gradientUnits="userSpaceOnUse"><stop stop-color="#100719"/><stop offset=".52" stop-color="#05040e"/><stop offset="1" stop-color="#090515"/></linearGradient>
    <linearGradient id="edge" x1="30" y1="55" x2="475" y2="455" gradientUnits="userSpaceOnUse"><stop stop-color="#78406f"/><stop offset=".45" stop-color="#ff704e"/><stop offset=".72" stop-color="#ff9749"/><stop offset="1" stop-color="#7431d4"/></linearGradient>
    <linearGradient id="signal" x1="126" y1="125" x2="385" y2="386" gradientUnits="userSpaceOnUse"><stop stop-color="#ff9a45"/><stop offset=".48" stop-color="#ff704b"/><stop offset="1" stop-color="#ff315f"/></linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="25" y="20" width="462" height="472" rx="116" fill="url(#tile)" stroke="url(#edge)" stroke-width="4"/>
  <rect x="32" y="27" width="448" height="458" rx="108" fill="none" stroke="#fff" stroke-opacity=".045"/>
  <circle cx="256" cy="258" r="145" fill="none" stroke="#45158a" stroke-width="55" opacity=".7" transform="translate(0 7)"/>
  <circle cx="256" cy="258" r="145" fill="none" stroke="url(#signal)" stroke-width="49" filter="url(#glow)"/>
  <path d="M135 258H210L237 190 286 337 316 258H377" fill="none" stroke="#42127f" stroke-width="55" stroke-linecap="butt" stroke-linejoin="round" opacity=".72" transform="translate(0 7)"/>
  <path d="M135 258H210L237 190 286 337 316 258H377" fill="none" stroke="url(#signal)" stroke-width="49" stroke-linecap="butt" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M142 235A145 145 0 0 1 364 157" fill="none" stroke="#ffd092" stroke-opacity=".32" stroke-width="3" stroke-linecap="round"/>
</svg>
